<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetLens // Nmap Security Assessment & Infrastructure Discovery Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Segoe UI', 'sans-serif'],
              mono: ['SFMono-Regular', 'Consolas', 'monospace'],
            },
            boxShadow: {
              neon: '0 0 0 1px rgba(34,211,238,0.15), 0 0 28px rgba(34,211,238,0.18)',
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --bg: #020817;
        --panel: rgba(15, 23, 42, 0.9);
        --panel-alt: rgba(15, 23, 42, 0.7);
        --cyan: #22d3ee;
        --emerald: #10b981;
        --amber: #f59e0b;
        --rose: #f43f5e;
        --slate: #94a3b8;
      }

      html, body, #root {
        height: 100%;
        background: radial-gradient(circle at top, rgba(34, 211, 238, 0.12), transparent 28%), #020817;
        color: #e2e8f0;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
      }

      .glass-panel {
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.7));
        border: 1px solid rgba(34, 211, 238, 0.18);
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.08), 0 20px 45px rgba(2, 6, 23, 0.45);
        backdrop-filter: blur(10px);
      }

      .cyber-border {
        border: 1px solid rgba(34, 211, 238, 0.2);
        box-shadow: inset 0 0 20px rgba(15, 118, 110, 0.08), 0 0 20px rgba(34, 211, 238, 0.12);
      }

      .scan-grid {
        background-image:
          linear-gradient(rgba(148,163,184,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148,163,184,0.07) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      .terminal-scroll::-webkit-scrollbar {
        width: 8px;
      }

      .terminal-scroll::-webkit-scrollbar-thumb {
        background: rgba(34, 211, 238, 0.25);
        border-radius: 9999px;
      }

      .status-indicator {
        position: relative;
        display: inline-flex;
        align-items: center;
      }

      .status-indicator::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #22d3ee;
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.9);
        margin-right: 0.5rem;
      }

      .node-glow {
        filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.5));
      }

      @media (max-width: 768px) {
        .metric-card {
          min-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useState, useMemo, useEffect, useRef } = React;

      const profileMap = {
        'ping-sweep': { label: 'Quick Ping Sweep (-sn)', command: '-sn', description: 'Fast host discovery' },
        'syn-scan': { label: 'SYN Stealth Scan (-sS)', command: '-sS', description: 'Half-open scanning technique' },
        'version-detect': { label: 'Service Version Detection (-sV)', command: '-sV', description: 'Banner grabbing and OS fingerprinting' },
        'vuln-audit': { label: 'Deep Vulnerability Audit (--script vuln)', command: '--script vuln', description: 'Comprehensive security audit' },
      };

      function createIcon(type, className = 'w-5 h-5') {
        const common = { stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round', fill: 'none' };
        const iconMap = {
          network: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <path d="M10 6.5h4M14 10v4M10 17.5h4M6.5 10v4" />
            </svg>
          ),
          shield: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M12 3l7 3v6c0 5-3.2 8.2-7 9-3.8-.8-7-4-7-9V6l7-3z" />
              <path d="M9.5 12.5l1.6 1.6 3.4-4.1" />
            </svg>
          ),
          activity: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M3 12h4l2-6 4 12 2-6h6" />
            </svg>
          ),
          target: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <circle cx="12" cy="12" r="7" />
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
            </svg>
          ),
          terminal: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M4 7l5 5-5 5M12 17h8" />
            </svg>
          ),
          table: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9z" />
              <path d="M4 10h16M9 5v14M15 5v14" />
            </svg>
          ),
          graph: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M3 18V6M8 18V10M13 18V4M18 18v-8M3 18h18" />
            </svg>
          ),
          alert: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M12 9v4M12 17h.01" />
              <path d="M12 3L2.8 18A2 2 0 0 0 4.6 21h14.8a2 2 0 0 0 1.8-3L12 3z" />
            </svg>
          ),
          download: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M12 4v10M8.5 18.5L12 22l3.5-3.5M4 20h16" />
            </svg>
          ),
          search: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <circle cx="11" cy="11" r="6" />
              <path d="M16 16L20 20" />
            </svg>
          ),
          filter: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M4 6h16M7 12h10M10 18h4" />
            </svg>
          ),
          clock: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <circle cx="12" cy="12" r="8" />
              <path d="M12 8v5l3 2" />
            </svg>
          ),
          trash: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M4 7h16M9 7V4h6v3M7 7l1 12h8l1-12" />
            </svg>
          ),
          rocket: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M14 3c2.5 1 4 3.5 5 6-2 1-4.5 2.8-7 5.2C9.7 17.5 7.8 19.5 5 21c1.5-2.8 3.5-4.7 6.8-7.1C14.2 11.1 16 8.5 17 6c-1 0-2.1-.3-3-1z" />
              <circle cx="13" cy="11" r="2" />
            </svg>
          ),
          arrow: (
            <svg viewBox="0 0 24 24" className={className} {...common}>
              <path d="M5 12h14M13 5l7 7-7 7" />
            </svg>
          ),
        };

        return iconMap[type] || null;
      }

      function formatMac() {
        const chars = 'ABCDEF0123456789';
        let result = '';
        for (let i = 0; i < 12; i += 1) {
          result += chars[Math.floor(Math.random() * chars.length)];
          if (i % 2 === 1 && i !== 11) result += ':';
        }
        return result;
      }

      function ipToInt(ip) {
        return ip.split('.').reduce((sum, octet) => (sum << 8) + Number(octet), 0) >>> 0;
      }

      function intToIp(value) {
        return [(value >>> 24) & 255, (value >>> 16) & 255, (value >>> 8) & 255, value & 255].join('.');
      }

      function parseTarget(target) {
        const trimmed = (target || '192.168.1.0/24').trim();
        const match = trimmed.match(/^(\d{1,3}(?:\.\d{1,3}){3})\/(\d{1,2})$/);
        if (match) {
          const baseIp = match[1];
          const prefix = Number(match[2]);
          const netMask = prefix >= 24 ? '255.255.255.0' : '255.255.0.0';
          return { baseIp, prefix, netMask, network: intToIp(ipToInt(baseIp) & ipToInt(netMask)) };
        }
        const single = trimmed.match(/^(\d{1,3}(?:\.\d{1,3}){3})$/);
        if (single) return { baseIp: single[1], prefix: 32, netMask: '255.255.255.255', network: single[1] };
        return { baseIp: '192.168.1.0', prefix: 24, netMask: '255.255.255.0', network: '192.168.1.0' };
      }

      function getSeverityColor(value) {
        if (value === 'Critical') return 'bg-rose-500/15 text-rose-300 border border-rose-400/30';
        if (value === 'High') return 'bg-amber-500/15 text-amber-300 border border-amber-400/30';
        if (value === 'Medium') return 'bg-cyan-500/15 text-cyan-300 border border-cyan-400/30';
        return 'bg-emerald-500/15 text-emerald-300 border border-emerald-400/30';
      }

      function generateHosts(target, profile) {
        const parsed = parseTarget(target);
        const networkBase = ipToInt(parsed.network);
        const hostCount = Math.max(8, Math.min(18, Math.round(10 + (Math.random() * 8))));
        const vendors = ['Cisco', 'Dell', 'HP', 'Juniper', 'Apple', 'Linux', 'Synology', 'Samsung', 'Aruba'];
        const osMap = ['Linux 5.15', 'Windows Server 2022', 'Ubuntu 22.04', 'Cisco IOS XE', 'FreeBSD 13', 'Android 14', 'VMware ESXi'];
        const serviceNames = ['ssh', 'http', 'https', 'mysql', 'rdp', 'smtp', 'dns', 'snmp', 'ftp', 'vnc'];

        const hosts = [];
        for (let i = 0; i < hostCount; i += 1) {
          const ipValue = networkBase + i + 10;
          const ip = intToIp(ipValue);
          const isUp = i % 3 !== 0;
          const portMap = [];
          const portCount = profile === 'ping-sweep' ? 1 : profile === 'syn-scan' ? 5 : profile === 'version-detect' ? 8 : 11;

          for (let p = 0; p < portCount; p += 1) {
            const port = [22, 80, 443, 21, 53, 3389, 8080, 3306, 5900, 111, 161, 445][p % 12] + (p > 5 ? p % 3 : 0);
            const service = serviceNames[p % serviceNames.length];
            const state = p % 4 === 0 ? 'closed' : 'open';
            if (state === 'open') {
              portMap.push({
                port,
                protocol: p % 2 === 0 ? 'tcp' : 'udp',
                service,
                state: 'open',
                version: `${service}/${(port % 7) + 12}`,
                risk: ['Critical', 'High', 'Medium', 'Low'][p % 4],
              });
            }
          }

          const hostname = i % 2 === 0 ? `host-${i + 1}` : `infra-${i + 1}`;
          const status = isUp ? 'Up' : 'Down';
          const severities = ['Critical', 'High', 'Medium', 'Low'];
          const hostRisk = severities[(i + (profile === 'vuln-audit' ? 2 : 1)) % severities.length];

          hosts.push({
            id: i + 1,
            ip,
            mac: formatMac(),
            vendor: vendors[i % vendors.length],
            hostname,
            osFamily: osMap[i % osMap.length],
            status,
            ports: portMap,
            risk: hostRisk,
            lastSeen: new Date(Date.now() - i * 300000).toISOString(),
          });
        }

        return hosts;
      }

      function createTerminalLog(profileCommand, index) {
        const commands = {
          'ping-sweep': [
            'Starting Nmap 7.94 ( https://nmap.org ) at 09:41 UTC',
            `Initiating ping sweep against ${profileCommand} target range`,
            'DNS resolution: 192.168.1.0/24',
            'Host discovery completed: 12 hosts responding',
            'Nmap done: 1 IP address (12 hosts up) scanned in 0.82s',
          ],
          'syn-scan': [
            'Starting Nmap 7.94 ( https://nmap.org ) at 09:43 UTC',
            'Initiating SYN Stealth Scan against 192.168.1.0/24',
            'Discovered open port 22/tcp ssh',
            'Discovered open port 80/tcp http',
            'Discovered open port 443/tcp https',
            'Scan completed successfully in 4.21s',
          ],
          'version-detect': [
            'Starting Nmap 7.94 ( https://nmap.org ) at 09:45 UTC',
            'Service version detection started',
            'Banner grab on 192.168.1.18:22/tcp -> OpenSSH 9.6p1',
            'Banner grab on 192.168.1.42:443/tcp -> nginx 1.25.4',
            'Fingerprinting complete for 9 active services',
            'Scan completed successfully in 8.61s',
          ],
          'vuln-audit': [
            'Starting Nmap 7.94 ( https://nmap.org ) at 09:48 UTC',
            'Running NSE vulnerability script suite on 192.168.1.0/24',
            'Enumerating common service misconfigurations',
            'vulners script: reported 3 high-risk advisories',
            'Checking for default credentials and exposed admin interfaces',
            'Scan completed successfully in 16.08s',
          ],
        };

        const sequence = commands[profileCommand] || commands['syn-scan'];
        return sequence[index % sequence.length];
      }

      function App() {
        const [target, setTarget] = useState('192.168.1.0/24');
        const [scanProfile, setScanProfile] = useState('syn-scan');
        const [isScanning, setIsScanning] = useState(false);
        const [progress, setProgress] = useState(0);
        const [logs, setLogs] = useState([
          'Starting Nmap 7.94 ( https://nmap.org )',
          'Initiating reconnaissance against 192.168.1.0/24',
          'Waiting for target response...',
        ]);
        const [hostData, setHostData] = useState(() => generateHosts('192.168.1.0/24', 'syn-scan'));
        const [searchTerm, setSearchTerm] = useState('');
        const [statusFilter, setStatusFilter] = useState('All');
        const [expandedRows, setExpandedRows] = useState({ 1: true });
        const [selectedHost, setSelectedHost] = useState(hostData[0]);
        const [reportOpen, setReportOpen] = useState(false);
        const [toast, setToast] = useState('');
        const terminalRef = useRef(null);

        const totalHosts = hostData.length;
        const totalOpenPorts = hostData.reduce((sum, host) => sum + host.ports.length, 0);
        const vulnerabilityCounts = useMemo(() => {
          const values = { Critical: 0, High: 0, Medium: 0, Low: 0 };
          hostData.forEach(host => {
            if (host.ports.length > 0) {
              const bucket = host.risk;
              if (bucket in values) values[bucket] += 1;
            }
          });
          return values;
        }, [hostData]);
        const totalVulns = Object.values(vulnerabilityCounts).reduce((sum, val) => sum + val, 0);

        useEffect(() => {
          const terminal = terminalRef.current;
          if (terminal) terminal.scrollTop = terminal.scrollHeight;
        }, [logs]);

        useEffect(() => {
          if (!toast) return undefined;
          const timer = setTimeout(() => setToast(''), 1800);
          return () => clearTimeout(timer);
        }, [toast]);

        const filteredHosts = useMemo(() => {
          return hostData.filter(host => {
            const matchesQuery = `${host.ip} ${host.hostname} ${host.vendor} ${host.osFamily}`.toLowerCase().includes(searchTerm.toLowerCase());
            const matchesStatus = statusFilter === 'All' || host.status === statusFilter;
            return matchesQuery && matchesStatus;
          });
        }, [hostData, searchTerm, statusFilter]);

        const toggleRow = id => {
          setExpandedRows(prev => ({ ...prev, [id]: !prev[id] }));
        };

        const handleLaunchScan = () => {
          setIsScanning(true);
          setProgress(2);
          setLogs([]);
          const newData = generateHosts(target, scanProfile);

          const steps = [
            'Starting Nmap 7.94 ( https://nmap.org )',
            `Initiating ${profileMap[scanProfile].label} against ${target}`,
            'Resolving hostnames and enumerating active devices',
            'Sending TCP packets and probing port states',
            'Performing service version detection and banner probing',
            'Running script-based vulnerability checks',
            'Scan completed successfully',
          ];

          let currentStep = 0;
          const interval = setInterval(() => {
            currentStep += 1;
            const logMessage = createTerminalLog(scanProfile, currentStep - 1);
            setLogs(prev => [...prev, logMessage]);
            setProgress(Math.min(100, currentStep * 12));

            if (currentStep >= steps.length) {
              clearInterval(interval);
              setHostData(newData);
              setSelectedHost(newData[0]);
              setProgress(100);
              setIsScanning(false);
              setToast('Scan complete');
            }
          }, 260);
        };

        const handleExportCsv = () => {
          const rows = [
            ['IP Address', 'MAC Address', 'Vendor', 'Hostname', 'OS Family', 'Status', 'Open Ports', 'Risk'],
            ...hostData.map(host => [
              host.ip,
              host.mac,
              host.vendor,
              host.hostname,
              host.osFamily,
              host.status,
              host.ports.map(p => `${p.port}/${p.protocol}`).join('; '),
              host.risk,
            ]),
          ];

          const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(',')).join('\n');
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'netlens-report.csv';
          a.click();
          URL.revokeObjectURL(url);
          setToast('CSV report exported');
        };

        const handleExportPdf = () => {
          setToast('Print dialog opened for PDF export');
          setTimeout(() => window.print(), 150);
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 scan-grid">
            <div className="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
              <header className="glass-panel rounded-2xl p-5 mb-6 border-cyan-500/20">
                <div className="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
                  <div>
                    <div className="flex items-center gap-3 text-cyan-300 mb-2">
                      <div className="rounded-full border border-cyan-400/40 bg-cyan-500/10 p-2">{createIcon('network', 'h-5 w-5')}</div>
                      <span className="text-xs font-medium uppercase tracking-[0.25em] text-cyan-200/80">CN&EH Course Project</span>
                    </div>
                    <h1 className="text-3xl font-bold tracking-tight text-white sm:text-4xl">
                      NetLens // Nmap Security Assessment & Infrastructure Discovery Framework
                    </h1>
                    <p className="mt-2 text-sm text-slate-300">
                      Advanced Network Reconnaissance Simulator
                    </p>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="status-indicator text-sm text-cyan-200 font-medium">System Active</div>
                    <div className="rounded-full border border-emerald-500/40 bg-emerald-500/10 px-3 py-1 text-xs font-medium text-emerald-300">
                      {isScanning ? 'Scan in Progress' : 'Ready'}
                    </div>
                  </div>
                </div>
              </header>

              <section className="grid gap-4 md:grid-cols-2 xl:grid-cols-4 mb-6">
                {[
                  { label: 'Total Hosts Scanned', value: totalHosts, icon: 'network', accent: 'cyan' },
                  { label: 'Open Ports Discovered', value: totalOpenPorts, icon: 'shield', accent: 'emerald' },
                  { label: 'Vulnerabilities Detected', value: totalVulns, icon: 'alert', accent: 'amber' },
                  { label: 'Active Scans', value: isScanning ? '1 Live' : 'Idle', icon: 'activity', accent: 'rose' },
                ].map(card => (
                  <div key={card.label} className="metric-card glass-panel cyber-border rounded-2xl p-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-xs uppercase tracking-[0.2em] text-slate-400">{card.label}</p>
                        <div className="mt-3 text-3xl font-bold text-white">{card.value}</div>
                      </div>
                      <div className={`rounded-xl p-3 ${card.accent === 'cyan' ? 'bg-cyan-500/10 text-cyan-300' : card.accent === 'emerald' ? 'bg-emerald-500/10 text-emerald-300' : card.accent === 'amber' ? 'bg-amber-500/10 text-amber-300' : 'bg-rose-500/10 text-rose-300'}`}>
                        {createIcon(card.icon, 'h-6 w-6')}
                      </div>
                    </div>
                  </div>
                ))}
              </section>

              <div className="grid gap-6 xl:grid-cols-[1.1fr_2fr]">
                <aside className="glass-panel cyber-border rounded-2xl p-5">
                  <div className="flex items-center gap-3 mb-5">
                    {createIcon('target', 'h-5 w-5 text-cyan-300')}
                    <h2 className="text-lg font-semibold text-white">Target & Scope Manager</h2>
                  </div>

                  <div className="space-y-4">
                    <div>
                      <label className="mb-2 block text-xs font-medium uppercase tracking-[0.18em] text-slate-400">Target network</label>
                      <input
                        value={target}
                        onChange={e => setTarget(e.target.value)}
                        className="w-full rounded-xl border border-cyan-500/20 bg-slate-900/80 px-3 py-3 text-sm text-slate-100 outline-none ring-0 transition focus:border-cyan-400/50"
                        placeholder="192.168.1.0/24"
                      />
                    </div>

                    <div>
                      <label className="mb-2 block text-xs font-medium uppercase tracking-[0.18em] text-slate-400">Scan profile</label>
                      <select
                        value={scanProfile}
                        onChange={e => setScanProfile(e.target.value)}
                        className="w-full rounded-xl border border-cyan-500/20 bg-slate-900/80 px-3 py-3 text-sm text-slate-100 outline-none transition focus:border-cyan-400/50"
                      >
                        {Object.entries(profileMap).map(([key, profile]) => (
                          <option key={key} value={key}>{profile.label}</option>
                        ))}
                      </select>
                    </div>

                    <div className="rounded-xl border border-cyan-500/15 bg-cyan-500/5 p-3 text-sm text-slate-300">
                      <div className="font-medium text-cyan-200">Selected Mode</div>
                      <div className="mt-1">{profileMap[scanProfile].description}</div>
                      <div className="mt-2 text-xs text-cyan-200/80">Command: {profileMap[scanProfile].command}</div>
                    </div>

                    <button
                      onClick={handleLaunchScan}
                      disabled={isScanning}
                      className="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
                    >
                      {isScanning ? <span className="animate-pulse">Scanning...</span> : <>{createIcon('rocket', 'h-4 w-4')} Launch Scan</>}
                    </button>
                  </div>
                </aside>

                <section className="glass-panel cyber-border rounded-2xl p-5">
                  <div className="mb-4 flex items-center justify-between gap-3">
                    <div className="flex items-center gap-3">
                      {createIcon('terminal', 'h-5 w-5 text-cyan-300')}
                      <h2 className="text-lg font-semibold text-white">Real-Time Terminal & Console</h2>
                    </div>
                    <div className="text-xs uppercase tracking-[0.2em] text-slate-400">Scan progress</div>
                  </div>

                  <div className="mb-4 h-2.5 w-full overflow-hidden rounded-full bg-slate-800">
                    <div
                      className="h-full rounded-full bg-gradient-to-r from-cyan-500 via-emerald-500 to-amber-500 transition-all duration-200"
                      style={{ width: `${progress}%` }}
                    />
                  </div>

                  <div ref={terminalRef} className="terminal-scroll h-[260px] overflow-y-auto rounded-xl border border-cyan-500/15 bg-slate-950/80 p-4 font-mono text-sm leading-6 text-slate-200">
                    {logs.length === 0 ? (
                      <div className="text-slate-500">Awaiting scan output...</div>
                    ) : (
                      logs.map((log, index) => (
                        <div key={`${log}-${index}`} className="mb-2 flex gap-3">
                          <span className="text-cyan-300">{index + 1}</span>
                          <span className="text-slate-200">{log}</span>
                        </div>
                      ))
                    )}
                  </div>
                </section>
              </div>

              <div className="mt-6 grid gap-6 xl:grid-cols-[1.6fr_1fr]">
                <section className="glass-panel cyber-border rounded-2xl p-5">
                  <div className="mb-5 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                    <div className="flex items-center gap-3">
                      {createIcon('table', 'h-5 w-5 text-cyan-300')}
                      <h2 className="text-lg font-semibold text-white">Asset Inventory & Host Table</h2>
                    </div>
                    <div className="flex flex-col gap-2 sm:flex-row">
                      <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">{createIcon('search', 'h-4 w-4')}</span>
                        <input
                          value={searchTerm}
                          onChange={e => setSearchTerm(e.target.value)}
                          placeholder="Search hosts"
                          className="w-full rounded-lg border border-cyan-500/20 bg-slate-900/80 py-2 pl-9 pr-3 text-sm text-slate-100 outline-none focus:border-cyan-400/50 sm:w-52"
                        />
                      </div>

                      <select
                        value={statusFilter}
                        onChange={e => setStatusFilter(e.target.value)}
                        className="rounded-lg border border-cyan-500/20 bg-slate-900/80 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-400/50"
                      >
                        <option>All</option>
                        <option>Up</option>
                        <option>Down</option>
                      </select>
                    </div>
                  </div>

                  <div className="overflow-hidden rounded-xl border border-slate-800">
                    <div className="overflow-x-auto">
                      <table className="min-w-full divide-y divide-slate-800 text-left text-sm">
                        <thead className="bg-slate-900/80 text-slate-300 uppercase tracking-[0.12em]">
                          <tr>
                            <th className="px-4 py-3">Host</th>
                            <th className="px-4 py-3">MAC</th>
                            <th className="px-4 py-3">Vendor</th>
                            <th className="px-4 py-3">OS</th>
                            <th className="px-4 py-3">Status</th>
                            <th className="px-4 py-3">Risk</th>
                            <th className="px-4 py-3"></th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800 bg-slate-950/40">
                          {filteredHosts.map(host => (
                            <React.Fragment key={host.id}>
                              <tr className="hover:bg-slate-900/50">
                                <td className="px-4 py-3 font-medium text-white">{host.hostname}</td>
                                <td className="px-4 py-3 text-slate-300">{host.mac}</td>
                                <td className="px-4 py-3 text-slate-300">{host.vendor}</td>
                                <td className="px-4 py-3 text-slate-300">{host.osFamily}</td>
                                <td className="px-4 py-3">
                                  <span className={`rounded-full px-2.5 py-1 text-xs font-medium ${host.status === 'Up' ? 'bg-emerald-500/15 text-emerald-300' : 'bg-slate-500/15 text-slate-300'}`}>
                                    {host.status}
                                  </span>
                                </td>
                                <td className="px-4 py-3">
                                  <span className={`inline-flex rounded-full px-2.5 py-1 text-xs font-medium ${getSeverityColor(host.risk)}`}>
                                    {host.risk}
                                  </span>
                                </td>
                                <td className="px-4 py-3 text-right">
                                  <button
                                    onClick={() => toggleRow(host.id)}
                                    className="rounded-lg border border-cyan-500/15 bg-slate-900 px-2 py-1 text-xs font-medium text-cyan-200"
                                  >
                                    {expandedRows[host.id] ? 'Hide' : 'Expand'}
                                  </button>
                                </td>
                              </tr>
                              {expandedRows[host.id] && (
                                <tr className="bg-slate-900/60">
                                  <td colSpan="7" className="px-4 py-4">
                                    <div className="grid gap-4 md:grid-cols-2">
                                      <div>
                                        <div className="mb-2 text-xs uppercase tracking-[0.18em] text-slate-400">Connection details</div>
                                        <div className="space-y-1 text-sm text-slate-300">
                                          <div>IP: <span className="text-white">{host.ip}</span></div>
                                          <div>Hostname: <span className="text-white">{host.hostname}</span></div>
                                          <div>Last seen: <span className="text-white">{new Date(host.lastSeen).toLocaleTimeString()}</span></div>
                                        </div>
                                      </div>
                                      <div>
                                        <div className="mb-2 text-xs uppercase tracking-[0.18em] text-slate-400">Open ports</div>
                                        <div className="flex flex-wrap gap-2">
                                          {host.ports.length ? host.ports.map(port => (
                                            <span key={`${host.ip}-${port.port}-${port.protocol}`} className="rounded-full bg-cyan-500/10 px-2.5 py-1 text-xs font-medium text-cyan-200 border border-cyan-500/20">
                                              {port.port}/{port.protocol}
                                            </span>
                                          )) : <span className="text-slate-400">No open ports detected</span>}
                                        </div>
                                      </div>
                                    </div>
                                  </td>
                                </tr>
                              )}
                            </React.Fragment>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </section>

                <aside className="glass-panel cyber-border rounded-2xl p-5">
                  <div className="flex items-center gap-3 mb-5">
                    {createIcon('graph', 'h-5 w-5 text-cyan-300')}
                    <h2 className="text-lg font-semibold text-white">Interactive Network Topology View</h2>
                  </div>

                  <div className="overflow-hidden rounded-xl border border-cyan-500/15 bg-slate-950/75 p-3">
                    <svg viewBox="0 0 500 280" className="w-full h-[260px]">
                      <defs>
                        <linearGradient id="flow" x1="0%" x2="100%" y1="0%" y2="0%">
                          <stop offset="0%" stopColor="#22d3ee" stopOpacity="0.2" />
                          <stop offset="50%" stopColor="#10b981" stopOpacity="0.5" />
                          <stop offset="100%" stopColor="#f59e0b" stopOpacity="0.25" />
                        </linearGradient>
                      </defs>

                      <circle cx="250" cy="25" r="22" fill="#0f172a" stroke="#22d3ee" strokeWidth="2" className="node-glow" />
                      <text x="250" y="30" textAnchor="middle" fill="#dbeafe" fontSize="11" fontWeight="700">GW</text>
                      <text x="250" y="51" textAnchor="middle" fill="#94a3b8" fontSize="10">Gateway</text>

                      {hostData.slice(0, 10).map((host, index) => {
                        const x = 65 + (index % 5) * 92;
                        const y = 120 + Math.floor(index / 5) * 70;
                        return (
                          <g key={host.id}>
                            <line x1="250" y1="50" x2={x + 14} y2={y + 16} stroke="url(#flow)" strokeWidth="2" />
                            <circle
                              cx={x + 14}
                              cy={y + 16}
                              r={host.status === 'Up' ? 16 : 12}
                              fill={host.status === 'Up' ? '#0f172a' : '#1e293b'}
                              stroke={host.status === 'Up' ? '#10b981' : '#64748b'}
                              strokeWidth="2"
                              className="node-glow cursor-pointer"
                              onClick={() => setSelectedHost(host)}
                              style={{ cursor: 'pointer' }}
                            />
                            <text x={x + 14} y={y + 21} textAnchor="middle" fill="#e2e8f0" fontSize="9" fontWeight="600">{host.hostname.split('-')[0]}</text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>

                  <div className="mt-4 rounded-xl border border-slate-700 bg-slate-900/70 p-3">
                    <div className="mb-2 text-xs uppercase tracking-[0.18em] text-slate-400">Selected Node</div>
                    {selectedHost ? (
                      <div className="space-y-2 text-sm text-slate-300">
                        <div className="flex items-center justify-between">
                          <span className="text-cyan-300">{selectedHost.hostname}</span>
                          <span className={`rounded-full px-2 py-1 text-[10px] font-semibold ${selectedHost.status === 'Up' ? 'bg-emerald-500/15 text-emerald-300' : 'bg-slate-500/15 text-slate-300'}`}>{selectedHost.status}</span>
                        </div>
                        <div>IP: <span className="text-white">{selectedHost.ip}</span></div>
                        <div>MAC: <span className="text-white">{selectedHost.mac}</span></div>
                        <div>OS: <span className="text-white">{selectedHost.osFamily}</span></div>
                        <div>Ports: <span className="text-white">{selectedHost.ports.length}</span></div>
                      </div>
                    ) : <div className="text-slate-400">No node selected.</div>}
                  </div>
                </aside>
              </div>

              <section className="mt-6 grid gap-4 md:grid-cols-3">
                {[
                  { label: 'Critical', count: vulnerabilityCounts.Critical },
                  { label: 'High', count: vulnerabilityCounts.High },
                  { label: 'Medium', count: vulnerabilityCounts.Medium },
                  { label: 'Low', count: vulnerabilityCounts.Low },
                ].map(item => (
                  <div key={item.label} className="glass-panel cyber-border rounded-2xl p-4">
                    <div className="flex items-center justify-between">
                      <span className="text-xs uppercase tracking-[0.18em] text-slate-400">{item.label}</span>
                      <span className={`rounded-full px-2 py-1 text-xs font-medium ${item.label === 'Critical' ? 'bg-rose-500/15 text-rose-300' : item.label === 'High' ? 'bg-amber-500/15 text-amber-300' : item.label === 'Medium' ? 'bg-cyan-500/15 text-cyan-300' : 'bg-emerald-500/15 text-emerald-300'}`}>
                        {item.count}
                      </span>
                    </div>
                  </div>
                ))}
              </section>
            </div>

            {reportOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 px-4 backdrop-blur-sm">
                <div className="glass-panel w-full max-w-2xl rounded-2xl border border-cyan-500/20 p-5">
                  <div className="mb-4 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      {createIcon('download', 'h-5 w-5 text-cyan-300')}
                      <h3 className="text-lg font-semibold text-white">Report Exporter</h3>
                    </div>
                    <button onClick={() => setReportOpen(false)} className="rounded-lg border border-slate-700 px-2 py-1 text-sm text-slate-300">Close</button>
                  </div>

                  <div className="mb-4 rounded-xl border border-cyan-500/15 bg-slate-900/70 p-4">
                    <div className="mb-3 flex items-center justify-between text-sm text-slate-300">
                      <span>Executive Summary</span>
                      <span>{new Date().toLocaleDateString()}</span>
                    </div>
                    <div className="space-y-2 text-sm text-slate-200">
                      <div>Total hosts discovered: <span className="text-white">{totalHosts}</span></div>
                      <div>Open ports: <span className="text-white">{totalOpenPorts}</span></div>
                      <div>Critical findings: <span className="text-white">{vulnerabilityCounts.Critical}</span></div>
                      <div>Target scope: <span className="text-white">{target}</span></div>
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-3">
                    <button onClick={handleExportCsv} className="rounded-xl bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950">Export CSV</button>
                    <button onClick={handleExportPdf} className="rounded-xl bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950">Export PDF</button>
                    <button onClick={() => setReportOpen(false)} className="rounded-xl border border-slate-600 px-4 py-2 text-sm font-semibold text-slate-200">Cancel</button>
                  </div>
                </div>
              </div>
            )}

            <button
              onClick={() => setReportOpen(true)}
              className="fixed bottom-6 right-6 z-40 flex items-center gap-2 rounded-full bg-gradient-to-r from-cyan-500 to-emerald-500 px-4 py-3 text-sm font-semibold text-slate-950 shadow-lg shadow-cyan-500/20"
            >
              {createIcon('download', 'h-4 w-4')} Export Report
            </button>

            {toast && (
              <div className="fixed bottom-6 left-6 z-50 rounded-full border border-cyan-500/30 bg-slate-900/90 px-4 py-2 text-sm text-cyan-200 shadow-xl shadow-cyan-500/10">
                {toast}
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
